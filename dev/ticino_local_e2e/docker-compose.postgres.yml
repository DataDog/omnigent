services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${E2E_POSTGRES_DB:?set by run.sh}
      POSTGRES_USER: ${E2E_POSTGRES_USER:?set by run.sh}
      POSTGRES_PASSWORD: ${E2E_POSTGRES_PASSWORD:?set by run.sh}
    ports:
      - "127.0.0.1:${E2E_POSTGRES_PORT:?set by run.sh}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 30
