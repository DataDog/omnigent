stages:
  - test
  - build
  - package

variables:
  REGISTRY: registry.ddbuild.io
  IMAGE_REPOSITORY: images/omnigent-server
  DOCKER_BUILDKIT: "1"

verify-release-input:{{.Rule.Variables.SERVICE_NAME}}:
  stage: test
  image: ${DOCKER_IMAGE}
  tags: ["arch:amd64"]
  variables:
    SERVICE_NAME: {{.Rule.Variables.SERVICE_NAME}}
  rules:
    # PRs prove that their own checkout can build, but never publish or signal
    # Conductor.  Release/DDR execution uses the signed-image path below.
    - if: '$DDR_WORKFLOW_ID'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: never
    - when: on_success
  script:
    - dd-docker buildx build --platform linux/amd64 --tag "${REGISTRY}/${IMAGE_REPOSITORY}:pr-verify" --build-arg SOURCE_URL="${CI_PROJECT_URL}" --build-arg VCS_REF="${CI_COMMIT_SHA}" --build-arg VERSION="pr-${CI_COMMIT_SHA:0:12}" .

build-and-sign:{{.Rule.Variables.SERVICE_NAME}}:
  stage: build
  image: ${DOCKER_IMAGE}
  tags: ["arch:amd64"]
  variables:
    SERVICE_NAME: {{.Rule.Variables.SERVICE_NAME}}
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$DDR_WORKFLOW_ID'
  id_tokens:
    DDSIGN_ID_TOKEN:
      aud: image-integrity
    DD_ATTEST_ID_TOKEN:
      aud: dd-attest
  script:
    - export VERSION="v${CI_PIPELINE_ID}-${CI_COMMIT_SHA:0:12}"
    - export METADATA_FILE=docker-metadata.json
    - dd-docker buildx build --provenance=mode=max --platform linux/amd64,linux/arm64 --label target=prod --build-arg SOURCE_URL="${CI_PROJECT_URL}" --build-arg VCS_REF="${CI_COMMIT_SHA}" --build-arg VERSION="${VERSION}" --tag "${REGISTRY}/${IMAGE_REPOSITORY}:${VERSION}" --push --metadata-file "${METADATA_FILE}" .
    - ddsign sign "${REGISTRY}/${IMAGE_REPOSITORY}:${VERSION}" --docker-metadata-file "${METADATA_FILE}"
    - IMAGE_DIGEST="$(jq -er '."containerimage.digest"' "${METADATA_FILE}")"
    - printf 'IMAGE_DIGEST=%s\nVERSION=%s\n' "${IMAGE_DIGEST}" "${VERSION}" > build.env
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - build.env

publish-conductor-bundle:{{.Rule.Variables.SERVICE_NAME}}:
  stage: package
  image: ${BUNDLER_IMAGE}
  tags: ["arch:amd64"]
  variables:
    SERVICE_NAME: {{.Rule.Variables.SERVICE_NAME}}
  rules:
    - if: '$DDR_WORKFLOW_ID'
  needs:
    - job: build-and-sign:{{.Rule.Variables.SERVICE_NAME}}
      artifacts: true
  script:
    # DDR_WORKFLOW_ID is a Dynamic Build pipeline variable, not a dotenv
    # artifact.  Fail before publication if DDCI did not propagate it.
    - test -n "${DDR_WORKFLOW_ID:?DDR_WORKFLOW_ID is required for Conductor publication}"
    - IMAGE_REF="${REGISTRY}/${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
    - ddr-package --service "${SERVICE_NAME}" --version "${VERSION}" --image-ref "${IMAGE_REF}" --deploy-config-path k8s/omnigent-server --flavor staging
