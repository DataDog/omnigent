---
# Generate a password on first install and retain it across upgrades.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Chart.Name }}-postgres
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $.Chart.Name }}-postgres
    app.kubernetes.io/instance: {{ $.Release.Name }}
    tags.datadoghq.com/service: {{ $.Chart.Name }}
    team: {{ $.Values.team }}
type: Opaque
stringData:
  {{- $existing := lookup "v1" "Secret" $.Release.Namespace (printf "%s-postgres" $.Chart.Name) }}
  POSTGRES_PASSWORD: {{ (($existing).data).POSTGRES_PASSWORD | default (randAlphaNum 32 | b64enc) | b64dec | quote }}
