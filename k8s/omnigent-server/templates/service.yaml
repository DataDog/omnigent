---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Chart.Name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $.Chart.Name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    tags.datadoghq.com/service: {{ $.Chart.Name }}
    team: {{ $.Values.team }}
  annotations:
    # Fabric selects this Service for Dev Gateway traffic.
    datadoghq.com/fabric-platform-dns: enable
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ $.Chart.Name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    - name: http
      port: {{ $.Values.port }}
      targetPort: http
      protocol: TCP
