apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Chart.Name }}-agents
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $.Chart.Name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    team: {{ $.Values.team }}
data:
  codex-native-ui.yaml: |
    name: codex-native-ui
    prompt: |
      Codex is running in the session terminal. Web UI messages are forwarded
      into the same native Codex app-server thread.
    executor:
      harness: codex-native
    spawn: true
    os_env:
      type: caller_process
      cwd: .
      # Keep the native Codex UI in the runner network namespace.
      sandbox:
        type: none
    terminals:
      zsh:
        command: zsh
        allow_cwd_override: true
        os_env:
          type: caller_process
          cwd: .
          sandbox:
            type: none
      bash:
        command: bash
        allow_cwd_override: true
        os_env:
          type: caller_process
          cwd: .
          sandbox:
            type: none
