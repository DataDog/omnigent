---
metadata:
  name: omnigent-server
  namespace: workspaces
  type: destination
  apiVersion: v1
spec:
  defaultConnectionConfig:
    # Omit protocol: the app serves HTTP/1.1.
    activeHealthCheck:
      # Use the server's health endpoint for active checks.
      http:
        path: /health
  defaultRouteConfig:
    # Long-lived SSE and WebSocket sessions require no request timeout.
    requestTimeout: 0s
  endpointGroups:
    main:
      connectionConfig:
        passiveHealthCheck:
          preset: DISABLE_PASSIVE_HC
      selector:
        kubernetesServiceSelector:
          name: omnigent-server
          namespace: workspaces
          port: 8000
