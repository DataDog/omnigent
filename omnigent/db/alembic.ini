[alembic]
script_location = omnigent/db/migrations
# Default to local SQLite for development. Override with
# OMNIGENT_DB_URL environment variable for other backends.
sqlalchemy.url = sqlite:///omnigent.db
# The Alembic version-tracking table defaults to ``alembic_version``. Override
# with OMNIGENT_ALEMBIC_VERSION_TABLE when sharing this schema with another
# Alembic-managed application to avoid a collision on that table. The value is
# read by migrations/env.py (passed to context.configure(version_table=...))
# and by omnigent.db.utils._get_current_db_revision, so both sides stay in
# sync automatically.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
