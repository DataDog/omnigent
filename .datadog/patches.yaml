schema-version: v1
patches:
  - id: OMNI-DELIVERY-001
    owner: workspaces
    status: datadog-only
    purpose: Build, sign, package, and deploy each consolidated-main checkout.
    reason: Keep image and chart delivery in this repository without image-tag handoffs.
    affected_paths:
      - .dynamic-build.yml
      - repository.datadog.yml
      - Dockerfile
      - .dockerignore
      - .gitlab/ci/release.yml
      - k8s/omnigent-server
    required_tests:
      - pytest tests/deploy/test_conductor_delivery.py
      - helm lint k8s/omnigent-server -f k8s/omnigent-server/lint_values.yaml
      - helm template omnigent-server k8s/omnigent-server -f k8s/omnigent-server/lint_values.yaml
    conflict_resolution_notes: Keep cnab.images.main digest injection and the immutable Habitat wheel.
    last_reviewed: 2026-09-18
    internal_references:
      - https://binaries.ddbuild.io/dd-source/python/omnigent_hab_launcher-0.0.132434155-py3-none-any.whl
    upstream_references: []
